name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DDEFAULT_EQ_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify universal binaries and signatures
        run: |
          vst3="build/DefaultEQ_artefacts/Release/VST3/default_eq.vst3"
          au="build/DefaultEQ_artefacts/Release/AU/default_eq.component"
          app="build/DefaultEQ_artefacts/Release/Standalone/default_eq.app"
          for bundle in "$vst3" "$au" "$app"; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done
          for binary in \
            "$vst3/Contents/MacOS/default_eq" \
            "$au/Contents/MacOS/default_eq" \
            "$app/Contents/MacOS/default_eq"; do
            lipo "$binary" -verify_arch arm64 x86_64
          done

      - name: Validate Audio Unit
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/default_eq.component"
          cp -R build/DefaultEQ_artefacts/Release/AU/default_eq.component \
            "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          python3 - <<'PY'
          import subprocess
          subprocess.run(["auval", "-v", "aufx", "Dfeq", "Icss"], check=True, timeout=180)
          PY

      - name: Validate VST3 with pluginval
        run: |
          curl --fail --location --retry 3 \
            --output pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval
          pluginval.app/Contents/MacOS/pluginval \
            --validate build/DefaultEQ_artefacts/Release/VST3/default_eq.vst3 \
            --strictness-level 10 --timeout-ms 120000

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="default_eq-v${version}-macOS-universal"
          mkdir -p "build/$package"
          cp -R build/DefaultEQ_artefacts/Release/VST3/default_eq.vst3 "build/$package/"
          cp -R build/DefaultEQ_artefacts/Release/AU/default_eq.component "build/$package/"
          cp -R build/DefaultEQ_artefacts/Release/Standalone/default_eq.app "build/$package/"
          cp README.md CHANGELOG.md LICENSE LICENSE.md THIRD_PARTY_NOTICES.md "build/$package/"
          cp -R LICENSES "build/$package/"
          ditto -c -k --sequesterRsrc --keepParent "build/$package" "build/$package.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/default_eq-v*-macOS-universal.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config xvfb unzip curl \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DDEFAULT_EQ_BUILD_TESTS=ON

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 3
          ctest --test-dir build --output-on-failure

      - name: Validate VST3 with pluginval
        run: |
          curl --fail --location --retry 3 \
            --output pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          chmod +x pluginval
          xvfb-run -a ./pluginval \
            --validate build/DefaultEQ_artefacts/Release/VST3/default_eq.vst3 \
            --strictness-level 10 --timeout-ms 120000

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="default_eq-v${version}-Linux-x86_64"
          mkdir -p "build/$package"
          cp -R build/DefaultEQ_artefacts/Release/VST3/default_eq.vst3 "build/$package/"
          cp build/DefaultEQ_artefacts/Release/Standalone/default_eq "build/$package/default_eq-Standalone"
          cp README.md CHANGELOG.md LICENSE LICENSE.md THIRD_PARTY_NOTICES.md "build/$package/"
          cp -R LICENSES "build/$package/"
          tar -C build -czf "build/$package.tar.gz" "$package"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/default_eq-v*-Linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DDEFAULT_EQ_BUILD_TESTS=ON

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 3
          ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" `
            -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe `
            --validate "build\DefaultEQ_artefacts\Release\VST3\default_eq.vst3" `
            --strictness-level 10 --timeout-ms 120000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $package = "default_eq-v$version-Windows-x64"
          $directory = "build\$package"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -Recurse "build\DefaultEQ_artefacts\Release\VST3\default_eq.vst3" $directory
          Copy-Item "build\DefaultEQ_artefacts\Release\Standalone\default_eq.exe" $directory
          Copy-Item README.md, CHANGELOG.md, LICENSE, LICENSE.md, THIRD_PARTY_NOTICES.md $directory
          Copy-Item -Recurse LICENSES $directory
          Compress-Archive -Path "$directory\*" -DestinationPath "build\$package.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/default_eq-v*-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true

      - name: Prepare release notes
        run: >-
          awk '/^## / { if (found) exit; found=1; next } found { print }'
          CHANGELOG.md > release-notes.md

      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: default_eq ${{ github.ref_name }}
          body_path: release-notes.md
          make_latest: true
          files: artifacts/*
